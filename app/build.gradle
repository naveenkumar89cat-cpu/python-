plugins {
    id 'com.android.application'
}

android {
    namespace 'com.robotadmin.aios'
    compileSdk 37
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.robotadmin.aios'
        minSdk 21
        targetSdk 37
        versionCode 17
        versionName '65.6.1-debug'
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O2 -Wall -Wextra'
                abiFilters 'arm64-v8a'
            }
        }
    }
    buildTypes {
        debug { debuggable true; minifyEnabled false }
        release { minifyEnabled false }
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt') } }
}

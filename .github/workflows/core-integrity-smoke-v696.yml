name: V69.6 Core Integrity Safe Smoke
on:
  pull_request:
    paths:
      - 'app/src/main/cpp/core_integrity_bundle_v696.cpp'
      - 'app/src/main/cpp/core_integrity_smoke_v696.cpp'
      - '.github/workflows/core-integrity-smoke-v696.yml'
  workflow_dispatch:
jobs:
  integrity-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: c++ -std=c++17 -O2 -Wall -Wextra app/src/main/cpp/core_integrity_smoke_v696.cpp -o /tmp/core_integrity
      - name: Verify dependency migration audit approval gates
        run: /tmp/core_integrity
      - name: Robot Admin isolation
        run: |
          if grep -RniE 'SmartConnect|SmartAPI|Angel One|placeOrder|order.place' app/src/main/cpp/core_integrity_bundle_v696.cpp app/src/main/cpp/core_integrity_smoke_v696.cpp; then exit 1; fi
          echo 'CORE INTEGRITY ISOLATION PASS'

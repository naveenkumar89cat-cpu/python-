name: V70.4 Dashboard Bridge Safe Smoke
on:
  pull_request:
    paths:
      - 'app/src/main/cpp/dashboard_bridge_v704.cpp'
      - 'app/src/main/cpp/dashboard_bridge_smoke_v704.cpp'
      - 'app/src/main/cpp/CMakeLists.txt'
      - '.github/workflows/dashboard-bridge-smoke-v704.yml'
  workflow_dispatch:
jobs:
  dashboard-bridge-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile dashboard bridge smoke
        run: c++ -std=c++17 -O2 -Wall -Wextra app/src/main/cpp/dashboard_bridge_smoke_v704.cpp -o /tmp/dashboard_bridge_smoke
      - name: Verify dashboard controls and locks
        run: /tmp/dashboard_bridge_smoke
      - name: Verify CMake wiring
        run: grep -q 'dashboard_bridge_v704.cpp' app/src/main/cpp/CMakeLists.txt
      - name: Trading isolation
        run: |
          if grep -RniE 'SmartConnect|SmartAPI|Angel One|placeOrder|order.place' app/src/main/cpp/dashboard_bridge_v704.cpp app/src/main/cpp/dashboard_bridge_smoke_v704.cpp; then exit 1; fi
          echo 'R4 DASHBOARD ISOLATION PASS'

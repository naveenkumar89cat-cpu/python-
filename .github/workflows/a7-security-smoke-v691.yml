name: V69.1 A7 Security Safe Smoke

on:
  pull_request:
    paths:
      - 'app/src/main/cpp/security_hardening_v691.cpp'
      - 'app/src/main/cpp/a7_security_smoke_v691.cpp'
      - '.github/workflows/a7-security-smoke-v691.yml'
  workflow_dispatch:

jobs:
  security-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile isolated security smoke
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra \
            app/src/main/cpp/a7_security_smoke_v691.cpp \
            -o /tmp/a7_security_smoke_v691
      - name: Run security gates
        run: /tmp/a7_security_smoke_v691
      - name: Robot Admin isolation check
        run: |
          if grep -RniE 'SmartConnect|SmartAPI|Angel One|broker login|placeOrder|order.place' \
            app/src/main/cpp/security_hardening_v691.cpp \
            app/src/main/cpp/a7_security_smoke_v691.cpp; then
            echo 'External trading integration reference detected in A7 files'
            exit 1
          fi
          echo 'ROBOT ADMIN A7 ISOLATION PASS'
